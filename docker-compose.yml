services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cartonium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cartonium}
      POSTGRES_DB: ${POSTGRES_DB:-cartonium}
    volumes:
      - cartonium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cartonium} -d ${POSTGRES_DB:-cartonium}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional full-stack run: docker compose --profile app up
  app:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-80}:80'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cartonium}:${POSTGRES_PASSWORD:-cartonium}@postgres:5432/${POSTGRES_DB:-cartonium}
      GAMEBOX_PICS_DIR: /data/gamebox-pics
    volumes:
      - cartonium_gamebox_pics:/data/gamebox-pics
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cartonium_pgdata:
  cartonium_gamebox_pics:
